# One-click hosting on Render (render.com): New -> Blueprint -> pick this repo.
services:
  - type: web
    name: world-war
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: ./data
      # Accounts are saved here when set. Paste a Postgres connection string
      # (for example a free Neon database) in the Render dashboard.
      - key: DATABASE_URL
        sync: false
    # To keep accounts and profile pictures across restarts, switch `plan` to a paid
    # plan (for example `starter`), set DATA_DIR to /var/data and uncomment this disk:
    # disk:
    #   name: world-war-data
    #   mountPath: /var/data
    #   sizeGB: 1
