<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1020">
<title>Delete your account · World War</title>
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<style>
  :root { --ink: #0b1020; --card: #141b33; --raised: #1e2742; --text: #eef1fb; --muted: #9aa6c8; --danger: #ff4d6d; --mint: #2ee6a6; }
  body { margin: 0; background: var(--ink); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 40px 16px; }
  h1 { font-size: 28px; margin: 0 0 8px; } p { color: var(--muted); }
  form { background: var(--card); border-radius: 20px; padding: 20px; display: grid; gap: 12px; margin-top: 20px; }
  input { font: inherit; color: var(--text); background: var(--raised); border: 0; border-radius: 12px; padding: 13px 14px; }
  button { font: inherit; font-weight: 800; border: 0; border-radius: 14px; padding: 14px; background: var(--danger); color: #fff; cursor: pointer; }
  button:disabled { opacity: .6; }
  #msg { min-height: 1.5em; margin: 0; font-weight: 700; }
  #msg.ok { color: var(--mint); } #msg.bad { color: var(--danger); }
  a { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Delete your World War account</h1>
  <p>This permanently removes your account, password, profile photo, bio, stats and friends list. It can't be undone.</p>
  <p>You can also do this in the game: <b>Profile → Delete account</b>.</p>
  <form id="f">
    <input id="u" placeholder="Username" autocomplete="username" required maxlength="16">
    <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
    <p id="msg"></p>
    <button id="go">Delete my account</button>
  </form>
  <p><a href="/privacy">Privacy policy</a> · <a href="/">Back to the game</a></p>
</main>
<script>
  const f = document.getElementById('f'), msg = document.getElementById('msg'), go = document.getElementById('go');
  f.onsubmit = async (e) => {
    e.preventDefault(); go.disabled = true; msg.className = ''; msg.textContent = 'Deleting…';
    try {
      const r = await fetch('/api/delete-account', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) });
      const d = await r.json(); msg.textContent = d.msg; msg.className = r.ok ? 'ok' : 'bad';
      if (r.ok) f.querySelectorAll('input').forEach(i => { i.value = ''; i.disabled = true; });
    } catch { msg.textContent = 'Couldn’t reach the server. Try again in a moment.'; msg.className = 'bad'; }
    go.disabled = false;
  };
</script>
</body>
</html>
